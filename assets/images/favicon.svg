    </linearGradient>
  </defs>
  <!-- Hoek achter het omgevouwen label -->
  <path d="M184.6,236.0 L238.3,205.0 Q247.0,200.0 255.7,205.0 L324.9,245.0 Q333.6,250.0 333.6,260.0 L333.6,295.0 Z" fill="#ffffff"/>
