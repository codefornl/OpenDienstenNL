<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} · {% endif %}OpenDiensten</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
    {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
    {% assign v = site.time | date: "%s" %}<link rel="stylesheet" href="/css/style.css?v={{ v }}">
    {% for stylesheet in page.stylesheets %}<link rel="stylesheet" href="{{ stylesheet }}?v={{ v }}">
    {% endfor %}<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f7f6f3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OpenDiensten">
</head>
<body>
    {% include molecules/prototype-banner.html %}
    {{ content }}
    {% if page.footer %}{% include organisms/site-footer.html %}{% endif %}
</body>
</html>
